# Where milestone checkpoints are sent (references/telemetry-contract.md).
# First non-comment line is used. The path is /sdk/agent-progress: the service
# nests its app routes under /sdk, so the handler named /agent-progress answers
# there. /sdk/log is the OTLP protobuf route and takes no query-string event.
# Overridden by $ONESIGNAL_SKILL_ENDPOINT or a project's .onesignal/endpoint
# (evals point at a loopback mock that way and never reach this).
https://api.onesignal.com/sdk/agent-progress
